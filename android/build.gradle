buildscript {
    ext {
        kotlin_version = '1.9.0'
        gradle_version = '8.1.0'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.android.tools.build:gradle:$gradle_version"
        // Updated for better Gradle 8.1 compatibility
        classpath 'com.google.gms:google-services:4.4.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.0'
    }
}

allprojects {
    repositories {
        // Firebase requires google() first
        google() {
            content {
                includeGroupByRegex "com.google.*"
                includeGroupByRegex "androidx.*"
                includeGroupByRegex "com.android.*"
                includeGroupByRegex "com.firebase.*"
            }
        }
        mavenCentral()
        // Fallback for Firebase and Google services
        maven {
            url "https://maven.google.com"
            name "Google"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
