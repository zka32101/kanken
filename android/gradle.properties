org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m
android.useAndroidX=true
android.enableJetifier=true
android.compileSdkVersion=34
# android.ndkVersion=23.1.7779620
# NDKバージョンを明示指定しない。Gradleが自動的に適切なバージョンを選択

# Gradle Daemon & Performance settings
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1

# Maven dependency resolution settings
org.gradle.dependency.resolution.refresh=true

# Maven repository mirror for CI environment - improve Firebase resolution
maven.repo.local=${user.home}/.m2/repository
org.gradle.internal.publish.checksums.insecure=true

# Gradle network settings for better dependency resolution
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
