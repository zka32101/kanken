// Load Flutter SDK path first
def localProperties = new Properties()
def localPropertiesFile = new File(settingsDir, 'local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterSdkPath = localProperties.getProperty('flutter.sdk')
if (flutterSdkPath == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // Allow plugins to declare their own repositories
    // to support Flutter SDK embedded artifacts
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven { url "${flutterSdkPath}/bin/cache/artifacts/engine/android" }
    }
}

rootProject.name = "kanken"
include ":app"

apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"
