pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // PREFER_SETTINGS_REPOS: settings.gradle repositories を優先
    // included build の repositories は許可（settings.gradle が優先）
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
    }
}

rootProject.name = "kanken"
include ":app"

// Load Flutter plugins dynamically
def localProperties = new Properties()
def localPropertiesFile = new File(rootProject.projectDir, 'local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterSdkPath = localProperties.getProperty('flutter.sdk')
if (flutterSdkPath == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"
