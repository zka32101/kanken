name: kanken
description: "うかラボ漢字検定 - 漢字検定学習アプリ"
publish_to: 'none'

version: 1.0.2+4
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  google_sign_in: ^6.1.6
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.4.0
  firebase_remote_config: ^4.3.0
  cloud_firestore: ^4.14.0
  cloud_functions: ^4.5.0

  # 端末内の学習記録（推しの成長）。app_common_kit も使う
  shared_preferences: ^2.3.0

  # Animation & Lottie
  lottie: ^2.4.0
  path_drawing: ^1.0.1

  # Fonts
  google_fonts: ^6.1.0

  # Audio & Haptics
  audioplayers: ^5.0.0

  # Charts
  fl_chart: ^1.0.0

  # Ads
  google_mobile_ads: ^5.0.0

  # Subscription / IAP (RevenueCat)
  purchases_flutter: ^10.13.2

  # Utils
  intl: ^0.19.0
  logger: ^2.0.0
  go_router: ^12.0.0
  uuid: ^4.0.0
  url_launcher: ^6.2.0

  # Common kits (全アプリ共通基盤)
  app_common_kit:
    git:
      url: https://github.com/zka32101/app_common_kit.git
      ref: v0.4.9
  cross_promo_kit:
    git:
      url: https://github.com/zka32101/cross_promo_kit
      ref: v0.2.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0
  custom_lint: ^0.5.0
  riverpod_lint: ^2.0.0

  # Testing
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/sounds/
    - assets/branding/
    - assets/icons_common/
