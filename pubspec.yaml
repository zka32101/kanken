name: kanken
description: "小学漢検チャレンジ - 小学生向け漢字検定学習アプリ"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # Core & UI
  petit_core:
    path: ../petit_core
  petit_ui:
    path: ../petit_ui
  petit_ai:
    path: ../petit_ai

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  firebase_firestore: ^4.14.0
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.4.0
  firebase_remote_config: ^4.3.0
  cloud_functions: ^4.5.0

  # Monetization
  purchases_flutter: ^7.7.0

  # Animation & Lottie
  lottie: ^2.4.0

  # Audio & Haptics
  audioplayers: ^5.0.0

  # Utils
  intl: ^0.19.0
  logger: ^2.0.0
  go_router: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0
  custom_lint: ^0.5.0
  riverpod_lint: ^2.0.0

  # Testing
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/sounds/
    - assets/images/

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
