name: Android Build

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "✅ Created android/local.properties"
          cat android/local.properties

      - name: Get Flutter dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub_get.log

      - name: Verify dependencies
        run: |
          if grep -q "error\|Error\|ERR" pub_get.log; then
            echo "❌ Dependency resolution failed"
            exit 1
          fi
          echo "✅ Dependencies resolved"

      - name: Check Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "❌ android/ directory not found"
            exit 1
          fi
          echo "✅ Android platform present"

      - name: Verify google-services.json
        run: |
          GSJ_PATH="android/app/google-services.json"
          if [ ! -f "$GSJ_PATH" ]; then
            echo "❌ google-services.json not found at $GSJ_PATH"
            exit 1
          fi
          echo "✅ google-services.json found"
          echo "=== google-services.json content ==="
          cat "$GSJ_PATH" | jq . 2>/dev/null || cat "$GSJ_PATH"

      - name: Clean Gradle Cache
        run: |
          cd android
          ./gradlew clean --info 2>&1 | head -50
          cd ..
          echo "✅ Gradle cache cleaned"

      - name: Network diagnostics for Maven repositories
        run: |
          echo "=== Testing Maven repository connectivity ==="
          echo ""
          echo "Testing Google Maven repository..."
          curl -I https://maven.google.com/ 2>&1 | head -5
          echo ""
          echo "Testing Maven Central..."
          curl -I https://repo.maven.apache.org/maven2/ 2>&1 | head -5
          echo ""
          echo "Testing GitHub Maven packages..."
          curl -I https://maven.pkg.github.com/ 2>&1 | head -5
          echo ""
          echo "✅ Network diagnostics complete"

      - name: Build APK (Debug)
        run: |
          set -o pipefail
          echo "Starting Flutter APK build (Gradle v8.1)..."
          echo "JVM Args: $(grep jvmargs android/gradle.properties)"
          echo ""
          echo "=== Gradle Configuration ==="
          cat android/gradle.properties
          echo ""

          # Run build with maximum verbosity and refresh dependencies
          flutter build apk --debug --verbose 2>&1 | tee build_debug.log
          BUILD_EXIT_CODE=$?
          echo "Build exit code: $BUILD_EXIT_CODE"

          echo ""
          echo "=== Checking build directory after build ==="
          if [ -d "build" ]; then
            echo "build/ exists"
            find build -type f -name "*.apk" 2>/dev/null | head -10 || echo "No APK files in build/"
            echo ""
            echo "build/ first level contents:"
            ls -la build/ 2>/dev/null | head -20
          else
            echo "build/ directory does not exist!"
          fi

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ Flutter build command failed with exit code $BUILD_EXIT_CODE"
            echo "Build log size: $(wc -l < build_debug.log) lines"
            exit $BUILD_EXIT_CODE
          fi
          echo "✅ Flutter build completed successfully"

      - name: Show detailed build log on failure
        if: failure()
        run: |
          echo "=== CRITICAL BUILD ERRORS ==="
          echo ""

          # Try to find the exact error
          if grep -i "error:" build_debug.log > /dev/null 2>&1; then
            echo "Found ERROR lines:"
            grep -i "error:" build_debug.log | grep -v "^D " | head -10
          fi

          if grep -i "FAILURE:" build_debug.log > /dev/null 2>&1; then
            echo ""
            echo "Gradle FAILURE details:"
            sed -n '/FAILURE:/,/^\*/p' build_debug.log | head -40
          fi

          if grep -i "Exception" build_debug.log > /dev/null 2>&1; then
            echo ""
            echo "Found exceptions:"
            grep "Exception" build_debug.log | head -10
          fi

          echo ""
          echo "=== Last 500 lines of build log ==="
          tail -500 build_debug.log

      - name: Upload build logs and structure as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_debug.log
            build_release.log
            build_structure.txt
          retention-days: 7
        continue-on-error: true

      - name: Debug - Save build directory structure
        if: always()
        run: |
          echo "=== Build Directory Structure ===" > build_structure.txt
          if [ -d "build" ]; then
            echo "build/ exists" >> build_structure.txt
            find build -type f 2>/dev/null | sort >> build_structure.txt || echo "Error listing build/" >> build_structure.txt
          else
            echo "build/ directory NOT found" >> build_structure.txt
          fi
          cat build_structure.txt

      - name: Verify APK
        run: |
          echo "=== Searching for APK in entire build directory ==="

          # Search for all APK files
          APK_FOUND=$(find build -name "*.apk" -type f 2>/dev/null | head -1)

          if [ -n "$APK_FOUND" ]; then
            SIZE=$(du -h "$APK_FOUND" | cut -f1)
            echo "✅ APK built successfully"
            echo "   Path: $APK_FOUND"
            echo "   Size: $SIZE"
            exit 0
          fi

          # If no APK found, show directory structure
          echo "❌ APK not found"
          echo ""
          echo "=== build/ directory structure ==="
          if [ -d "build" ]; then
            ls -lah build/ 2>/dev/null || true
            echo ""
            echo "=== Searching in build/ ==="
            find build -type f -name "*.apk" 2>/dev/null || echo "No .apk files found"
            echo ""
            echo "=== Last 150 lines of build log ==="
            tail -150 build_debug.log || cat build_debug.log || true
          else
            echo "build/ directory not found!"
          fi

          exit 1

      - name: Build App Bundle (Release)
        run: |
          set -o pipefail
          flutter build appbundle --release 2>&1 | tee build_release.log
        continue-on-error: true

      - name: Verify App Bundle
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            SIZE=$(du -h "$AAB_PATH" | cut -f1)
            echo "✅ App Bundle built successfully"
            echo "   Path: $AAB_PATH"
            echo "   Size: $SIZE"
          else
            echo "⚠️  App Bundle not found (may require signing setup)"
            echo "   Expected: $AAB_PATH"
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/**/*.apk
          retention-days: 7

      - name: Upload App Bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
        continue-on-error: true

      - name: Report status
        run: |
          echo "## Android Build Summary"
          echo "- APK: $([ -f build/app/outputs/apk/debug/app-debug.apk ] && echo '✅ OK' || echo '❌ Failed')"
          echo "- AAB: $([ -f build/app/outputs/bundle/release/app-release.aab ] && echo '✅ OK' || echo '⚠️  Skipped/Failed')"
