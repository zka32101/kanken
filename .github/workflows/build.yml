name: Flutter Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'

      - name: Create local.properties for Android build
        run: |
          FLUTTER_SDK=$(which flutter | xargs dirname | xargs dirname)
          echo "Flutter SDK detected at: $FLUTTER_SDK"
          cat > android/local.properties << EOF
          flutter.sdk=$FLUTTER_SDK
          flutter.buildMode=debug
          flutter.versionName=1.0
          flutter.versionCode=1
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_NDK
          EOF
          cat android/local.properties

      - name: Setup Firebase configuration
        run: |
          echo "Generating firebase_options.dart from google-services.json..."
          bash scripts/generate-firebase-options.sh

      - name: Get dependencies
        run: flutter pub get --verbose

      - name: Generate Riverpod files
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run unit tests
        run: |
          set -o pipefail
          flutter test --verbose 2>&1 | tee test-output.log || true

      - name: Extract and display failed tests
        if: failure()
        run: |
          echo "=== Failed Tests ==="
          grep -i "failed\|expected\|actual" test-output.log || echo "No specific failure pattern found"
          tail -100 test-output.log

      - name: Upload test output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-log
          path: test-output.log

      - name: Run integration tests
        if: success()
        run: flutter test integration_test --verbose || true

      - name: Analyze Dart code
        if: success()
        run: |
          echo "=== Running Flutter Analyze ==="
          flutter analyze --verbose || echo "Analysis completed with warnings"
          echo ""
          echo "=== Running Dart Analyze ==="
          dart analyze lib/ || echo "Dart analysis completed with warnings"

      - name: Build Android APK (Release)
        if: success()
        run: |
          echo "=== Building Release APK ==="
          set -o pipefail
          flutter build apk --release 2>&1 | tee release-build.log
          BUILD_EXIT_CODE=$?
          echo ""
          echo "Build exit code: $BUILD_EXIT_CODE"
          echo ""
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "Release build failed. Attempting debug build..."
            echo "=== Attempting Debug APK build as fallback ==="
            flutter build apk --debug 2>&1 | tee debug-build.log
            exit $?
          else
            echo "Release build succeeded!"
            ls -lah build/app/outputs/apk/release/app-release.apk 2>/dev/null && echo "Release APK found"
          fi

      - name: Build Android App Bundle
        if: success()
        run: |
          set -o pipefail
          flutter build appbundle --verbose 2>&1 | tee aab-build.log || (tail -200 aab-build.log && exit 1)

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            release-build.log
            debug-build.log
            aab-build.log

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/apk/release/
            build/app/outputs/apk/debug/
            build/app/outputs/bundle/debug/
