name: Flutter Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get --verbose

      - name: Run unit tests
        run: flutter test --verbose 2>&1 | tee test-output.log

      - name: Extract and display failed tests
        if: failure()
        run: |
          echo "=== Failed Tests ==="
          grep -i "failed\|expected\|actual" test-output.log || echo "No specific failure pattern found"
          tail -100 test-output.log

      - name: Run integration tests
        if: success()
        run: flutter test integration_test --verbose || true
