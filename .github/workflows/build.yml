name: Flutter Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'

      - name: Create local.properties for Android build
        run: |
          FLUTTER_SDK=$(which flutter | xargs dirname | xargs dirname)
          echo "Flutter SDK detected at: $FLUTTER_SDK"
          cat > android/local.properties << EOF
          flutter.sdk=$FLUTTER_SDK
          flutter.buildMode=debug
          flutter.versionName=1.0
          flutter.versionCode=1
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_NDK
          EOF
          cat android/local.properties

      - name: Setup Firebase configuration
        run: |
          echo "Generating firebase_options.dart from google-services.json..."
          bash scripts/generate-firebase-options.sh

      - name: Get dependencies
        run: |
          flutter pub get --verbose
          echo "=== Repair Dart/Flutter cache ==="
          flutter pub cache repair || echo "Cache repair completed"
          echo "=== Verify Android platform dependencies ==="
          flutter pub get --platform android --verbose || echo "Android platform verification completed"

      - name: Debug Flutter Build Environment
        run: |
          echo "=== Dart version ==="
          dart --version
          echo ""
          echo "=== Flutter build environment info ==="
          flutter config --no-analytics
          flutter config
          echo ""
          echo "=== Check for pubspec.lock issues ==="
          grep -A 5 "firebase\|cloud_firestore\|firebase_core" pubspec.lock | head -50

      - name: Run unit tests
        run: |
          set -o pipefail
          flutter test --verbose 2>&1 | tee test-output.log || true

      - name: Extract and display failed tests
        if: failure()
        run: |
          echo "=== Failed Tests ==="
          grep -i "failed\|expected\|actual" test-output.log || echo "No specific failure pattern found"
          tail -100 test-output.log

      - name: Upload test output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-log
          path: test-output.log

      - name: Run integration tests
        if: success()
        run: flutter test integration_test --verbose || true

      - name: Analyze Dart code
        if: success()
        run: |
          echo "=== Running Flutter Analyze ==="
          flutter analyze --verbose || echo "Analysis completed with warnings"
          echo ""
          echo "=== Running Dart Analyze ==="
          dart analyze lib/ || echo "Dart analysis completed with warnings"

      - name: Ensure debug keystore exists
        if: success()
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android App Bundle
        if: success()
        run: |
          set -o pipefail
          echo "=== Memory before build ==="
          free -h
          echo "=== Building Android App Bundle (AAB) ==="
          flutter build appbundle --release --verbose 2>&1 | tee aab-build.log || true
          echo "=== Memory after build ==="
          free -h
          echo "=== Checking dmesg for OOM kills ==="
          dmesg 2>/dev/null | grep -i "killed process\|out of memory" || echo "(dmesg unavailable or no OOM entries)"
          echo "=== Searching for any .aab file under build/ ==="
          find build -iname "*.aab" -exec ls -lah {} \; || true
          if [ ! -f build/app/outputs/bundle/release/app-release.aab ]; then
            echo "::error::app-release.aab not found at the expected path"
            exit 1
          fi
          ls -lah build/app/outputs/bundle/release/app-release.aab
          echo "✅ AAB build succeeded"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            aab-build.log
            release-apk.log
            gradle-build.log
            release-build.log
            debug-build.log

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/apk/release/
            build/app/outputs/bundle/release/
            build/app/outputs/apk/debug/
            build/app/outputs/bundle/debug/
