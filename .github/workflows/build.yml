name: Flutter Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'

      - name: Create local.properties for Android build
        run: |
          FLUTTER_SDK=$(which flutter | xargs dirname | xargs dirname)
          echo "Flutter SDK detected at: $FLUTTER_SDK"
          cat > android/local.properties << EOF
          flutter.sdk=$FLUTTER_SDK
          flutter.buildMode=debug
          flutter.versionName=1.0
          flutter.versionCode=1
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_NDK
          EOF
          cat android/local.properties

      - name: Setup Firebase configuration
        run: |
          echo "Generating firebase_options.dart from google-services.json..."
          bash scripts/generate-firebase-options.sh

      - name: Get dependencies
        run: |
          flutter pub get --verbose
          echo "=== Repair Dart/Flutter cache ==="
          flutter pub cache repair || echo "Cache repair completed"
          echo "=== Verify Android platform dependencies ==="
          flutter pub get --platform android --verbose || echo "Android platform verification completed"

      - name: Generate Riverpod files
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Debug Flutter Build Environment
        run: |
          echo "=== Dart version ==="
          dart --version
          echo ""
          echo "=== Flutter build environment info ==="
          flutter config --no-analytics
          flutter config
          echo ""
          echo "=== Check for pubspec.lock issues ==="
          grep -A 5 "firebase\|cloud_firestore\|firebase_core" pubspec.lock | head -50

      - name: Run unit tests
        run: |
          set -o pipefail
          flutter test --verbose 2>&1 | tee test-output.log || true

      - name: Extract and display failed tests
        if: failure()
        run: |
          echo "=== Failed Tests ==="
          grep -i "failed\|expected\|actual" test-output.log || echo "No specific failure pattern found"
          tail -100 test-output.log

      - name: Upload test output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-log
          path: test-output.log

      - name: Run integration tests
        if: success()
        run: flutter test integration_test --verbose || true

      - name: Analyze Dart code
        if: success()
        run: |
          echo "=== Running Flutter Analyze ==="
          flutter analyze --verbose || echo "Analysis completed with warnings"
          echo ""
          echo "=== Running Dart Analyze ==="
          dart analyze lib/ || echo "Dart analysis completed with warnings"

      - name: Build Android App Bundle
        if: success()
        env:
          GRADLE_OPTS: "-Xmx2048m"
        run: |
          echo "=== Building App Bundle (AAB) ==="
          set -o pipefail
          flutter build appbundle --release 2>&1 | tail -200 | tee aab-build.log
          AAB_EXIT=$?
          echo ""
          echo "AAB Build exit code: $AAB_EXIT"
          if [ $AAB_EXIT -eq 0 ]; then
            echo "AAB build succeeded!"
            ls -lah build/app/outputs/bundle/release/app-release.aab 2>/dev/null && echo "AAB found"
            exit 0
          fi

          echo ""
          echo "=== AAB build failed. Trying APK release ==="
          flutter build apk --release 2>&1 | tail -200 | tee release-apk.log
          APK_EXIT=$?
          echo "APK Build exit code: $APK_EXIT"
          exit $APK_EXIT

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            aab-build.log
            release-apk.log
            gradle-build.log
            release-build.log
            debug-build.log

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/apk/release/
            build/app/outputs/bundle/release/
            build/app/outputs/apk/debug/
            build/app/outputs/bundle/debug/
