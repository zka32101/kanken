name: Flutter Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'

      - name: Create local.properties for Android build
        run: |
          FLUTTER_SDK=$(which flutter | xargs dirname | xargs dirname)
          echo "Flutter SDK detected at: $FLUTTER_SDK"
          cat > android/local.properties << EOF
          flutter.sdk=$FLUTTER_SDK
          flutter.buildMode=debug
          flutter.versionName=1.0
          flutter.versionCode=1
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_NDK
          EOF
          cat android/local.properties

      - name: Setup Firebase configuration
        run: |
          echo "Generating firebase_options.dart from google-services.json..."
          bash scripts/generate-firebase-options.sh

      - name: Get dependencies
        run: flutter pub get --verbose

      - name: Generate Riverpod files
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run unit tests
        run: |
          set -o pipefail
          flutter test --verbose 2>&1 | tee test-output.log || true

      - name: Extract and display failed tests
        if: failure()
        run: |
          echo "=== Failed Tests ==="
          grep -i "failed\|expected\|actual" test-output.log || echo "No specific failure pattern found"
          tail -100 test-output.log

      - name: Upload test output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-log
          path: test-output.log

      - name: Run integration tests
        if: success()
        run: flutter test integration_test --verbose || true

      - name: Build Android APK
        if: success()
        run: |
          echo "=== Environment Variables ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "PATH=$PATH"
          echo ""
          echo "=== local.properties content ==="
          cat android/local.properties || echo "local.properties not found!"
          echo ""
          echo "=== Verify Flutter executable ==="
          which flutter && flutter --version && flutter doctor -v || echo "Flutter not found"
          echo ""
          echo "=== Gradle wrapper check ==="
          ls -lah android/gradle/wrapper/gradle-wrapper.jar || echo "gradle-wrapper.jar not found"
          echo ""
          echo "=== Clean Flutter build cache ==="
          flutter clean
          flutter pub get --verbose
          echo ""
          echo "=== Starting APK build with debug ==="
          set -o pipefail
          flutter build apk --debug --verbose --no-tree-shake-icons 2>&1 | tee apk-build.log
          BUILD_EXIT_CODE=$?
          echo ""
          echo "Build exit code: $BUILD_EXIT_CODE"
          echo ""
          echo "=== Last 500 lines of build output ==="
          tail -500 apk-build.log
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            exit $BUILD_EXIT_CODE
          fi

      - name: Build Android App Bundle
        if: success()
        run: |
          set -o pipefail
          flutter build appbundle --verbose 2>&1 | tee aab-build.log || (tail -200 aab-build.log && exit 1)

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            apk-build.log
            aab-build.log

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/apk/debug/
            build/app/outputs/bundle/debug/
